server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aset ber-hash (JS/CSS/font hasil build) — aman di-cache setahun
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Index pencarian Pagefind — cukup cache pendek
    location /pagefind/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # HTML selalu segar supaya deploy terlihat langsung
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    # Halaman 404.html di-root Astro, bukan folder — pastikan bisa diambil
    location = /404.html {
        internal;
        root /usr/share/nginx/html;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/xml image/svg+xml application/json;
    gzip_min_length 1024;
}
