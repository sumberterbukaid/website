name: CI

# PR dari siapa pun (termasuk fork) hanya di-build di runner cloud GitHub.
# Keamanan repo publik: PR fork TIDAK PERNAH menyentuh runner self-hosted.
on:
  pull_request:

jobs:
  build:
    name: Verifikasi build (cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (astro + pagefind)
        run: npm run build
